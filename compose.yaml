services:
  systems:
    image: nginx:1.28-alpine
    container_name: home-server-systems
    restart: unless-stopped
    ports:
      - "127.0.0.1:8084:80"
    volumes:
      - ./nginx:/etc/nginx/conf.d:ro
      - ./public:/usr/share/nginx/html:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m
    cpus: 0.25
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
