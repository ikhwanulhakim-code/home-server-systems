# Internal Nginx configuration for the portfolio viewer container.
# The container is reached through the host reverse proxy on 127.0.0.1:8084.

# Requests that do not match a published hostname get no content.
server {
    listen 80 default_server;
    server_name _;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 404;
    }
}

# The Systems view. Its document root excludes the deferred Build view.
server {
    listen 80;
    server_name systems.home.internal systems.ikhwanulhakim.com;

    root /usr/share/nginx/html/systems;
    index index.html;

    charset utf-8;

    # Shared CSS, JavaScript, fonts, and images sit beside the Systems pages.
    location /assets/ {
        root /usr/share/nginx/html;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
